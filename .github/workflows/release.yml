name: Publish tested Docker release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/check_public.py
      - run: python3 -m unittest discover -s tests -v
      - run: |
          node tests/test_bus_ui.js
          node tests/test_home_ui.js
          node tests/test_display_ui.js
          PYTHONPATH=. python3 tests/browser_household.py
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise exact local image
        run: bash tests/docker_smoke.sh
      - name: Push tested architecture
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$image:sha-$GITHUB_SHA-$ARCH"
          docker tag kindle-home-dashboard:dev "$tag"
          docker push "$tag"
  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish multi-platform manifest and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$image:$VERSION" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          digest="$(docker buildx imagetools inspect "$image:$VERSION" | awk '$1=="Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '镜像（固定摘要）：\n\n`%s@%s`\n\n支持 Linux amd64/arm64。此为现场验收候选，未在真实极空间与 Kindle 验证。首次使用 GHCR 可能需要仓库所有者将镜像包设为公开；不要上传私有配置。安装使用 compose.release.yaml，详情见 docs/DEPLOYMENT.md。\n' "$image" "$digest" > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --prerelease --notes-file "$RUNNER_TEMP/notes.md" compose.release.yaml
          # Advance the opt-in candidate channel only after the versioned release exists.
          docker buildx imagetools create -t "$image:preview" "$image@$digest"
