name: Publish tested Docker release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/check_public.py
      - name: Validate NAS Compose template
        env:
          KHD_LAN_HOST: 192.168.1.100
          KHD_LAN_NETWORK: 192.168.1.0/24
        run: docker compose -f compose.release.yaml config --quiet
      - run: python3 -m unittest discover -s tests -v
      - run: |
          node tests/test_bus_ui.js
          node tests/test_home_ui.js
          node tests/test_display_ui.js
          PYTHONPATH=. python3 tests/browser_household.py
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise exact local image
        run: bash tests/docker_smoke.sh
      - name: Push tested architecture
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$image:sha-$GITHUB_SHA-$ARCH"
          docker tag kindle-home-dashboard:dev "$tag"
          docker push "$tag"
  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish public multi-platform image and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$image:$VERSION" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          # A public source repository does not guarantee public GHCR package access.
          # Try to set package visibility, then verify an anonymous pull before release.
          if ! gh api --method PATCH "/user/packages/container/kindlehomedashboard/visibility" -f visibility=public >/dev/null; then
            echo "::warning::Could not change GHCR package visibility automatically; checking anonymous access."
          fi
          docker logout ghcr.io >/dev/null 2>&1 || true
          if ! docker pull "$image:$VERSION"; then
            echo "::error::GHCR image is not anonymously pullable. Set the package visibility to Public, then rerun this workflow."
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '候选镜像标签：\n\n`%s:%s`\n\n自动更新标签：`%s:preview`。支持 Linux amd64/arm64。此为现场验收候选，未在真实极空间与 Kindle 验证。镜像须可匿名拉取；家庭数据保存在独立 Docker 命名卷。安装使用 compose.release.yaml，详情见 docs/DEPLOYMENT.md。\n' "$image" "$VERSION" "$image" > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --prerelease --notes-file "$RUNNER_TEMP/notes.md" compose.release.yaml
          docker buildx imagetools create -t "$image:preview" "$image:$VERSION"
