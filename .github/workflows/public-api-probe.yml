name: One-time public API probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-api-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Unrelated public bus example, no credentials or raw payloads
        shell: python
        run: |
          import json, urllib.request, urllib.error
          def post(path, body):
              req=urllib.request.Request("https://api.shmaas.net"+path,data=json.dumps(body).encode(),headers={"Content-Type":"application/json","X-Saic-CityCode":"310100","Accept":"application/json","User-Agent":"KindleHomeDashboard-public-api-test/1.0"},method="POST")
              with urllib.request.urlopen(req,timeout=15) as res:
                  d=json.loads(res.read(1048576))
                  print("PROBE",path,"HTTP",res.status,"business_code",d.get("errCode"),"data_type",type(d.get("data")).__name__)
                  if d.get("errCode") != 0: return {}
                  return d.get("data") or {}
          try:
              d=post("/traffic/v2/querytrafficline",{"keywords":"71路","type":0,"pageNo":1,"pageSize":20})
              rows=[]
              for item in d.get("trafficStop",[]):
                  rows.extend(item.get("stopLineInfo") or [])
                  if item.get("lineInfo"): rows.append(item["lineInfo"])
              line=next((x for x in rows if x.get("lineName")=="71路" and x.get("lineId") and x.get("upDown") is not None),None)
              print("PROBE search_exact_match",bool(line))
              if line:
                  direction=str(line["upDown"])
                  d=post("/traffic/v1/querybusline",{"lineId":line["lineId"],"lineName":line["lineName"],"direction":direction})
                  stops=(d.get("busLine") or {}).get("stop") or []
                  print("PROBE stop_count",len(stops))
                  if len(stops)>2:
                      s=stops[len(stops)//2]
                      d=post("/traffic/v1/getbusstoparrivedetails",{"lineName":line["lineName"],"stopName":s["stopName"],"stopId":s["stopId"],"direction":direction})
                      a=d.get("stopArriveInfo") or {}
                      print("PROBE eta_fields", {k: (k in a and a[k] is not None and a[k] != "") for k in ("currentBusArriveTime","nextBusArriveTime","currentBusDistance","nextBusDistance","currentBusStopCount","nextBusStopCount")}, "schedule_present",bool(d.get("dispatchCarSchedule")))
          except urllib.error.HTTPError as e:
              print("PROBE HTTP",e.code,"stop")
          except Exception as e:
              print("PROBE error",type(e).__name__)
