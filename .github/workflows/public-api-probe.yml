name: One-time public API probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-api-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check documented response shape and provider messages
        shell: python
        run: |
          import json, urllib.parse, urllib.request, urllib.error
          def summarize(d):
              if not isinstance(d,dict):
                  return {"root_type":type(d).__name__}
              messages=[]
              rows=[]
              def walk(x):
                  if isinstance(x,dict):
                      if any(k in x for k in ("expected_arrival","estimated_time","remaining_stations")):
                          rows.append(x)
                      for v in x.values():
                          walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
                  elif isinstance(x,str):
                      for tag in ("暂无","未找到","查不到","未查询","没有","无数据","失败","错误","站点","线路","限流","维护","停止","运营","超时","城市","权限","参数"):
                          if tag in x and tag not in messages: messages.append(tag)
              data=d.get("data")
              walk(data)
              walk(d.get("msg"))
              return {"business_code":d.get("code"),"data_type":type(data).__name__,"entries":len(data) if isinstance(data,(dict,list)) else None,"vehicle_like":len(rows),"ETA_nonempty":sum(bool(x.get("expected_arrival") or x.get("estimated_time")) for x in rows),"message_categories":messages}
          for city,site,direction in [("深圳","京基",0),("上海","人民广场",0),("上海","人民广场",1)]:
              params={"city":city,"site":site}
              if direction: params["backward"]=1
              try:
                  req=urllib.request.Request("https://api.code410.com/api/traffic/bus?"+urllib.parse.urlencode(params),headers={"Accept":"application/json","User-Agent":"KindleHomeDashboard-public-api-test/1.0"})
                  with urllib.request.urlopen(req,timeout=12) as res:
                      d=json.loads(res.read(1048576))
                      print("PROBE", city,site,direction,res.status,json.dumps(summarize(d),ensure_ascii=False))
              except Exception as exc:
                  print("PROBE",city,site,direction,type(exc).__name__,getattr(exc,"code",""))
