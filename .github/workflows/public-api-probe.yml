name: One-time public API probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-api-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Two terminal public stops
        shell: python
        run: |
          import json, re, urllib.request, urllib.error, datetime
          def post(path, body):
              req=urllib.request.Request("https://api.shmaas.net"+path,data=json.dumps(body).encode(),headers={"Content-Type":"application/json","X-Saic-CityCode":"310100","Accept":"application/json","User-Agent":"KindleHomeDashboard-public-api-test/1.0"},method="POST")
              with urllib.request.urlopen(req,timeout=15) as res:
                  d=json.loads(res.read(1048576))
                  print("PROBE",path,"HTTP",res.status,"business_code",d.get("errCode"))
                  if d.get("errCode") != 0: raise ValueError("Business failure")
                  return d.get("data") or {}
          def norm(v):
              return re.sub(r"[\s（）()路]", "", str(v)).upper().replace("线","")
          def state(v):
              if v is None: return None
              z=str(v).strip()
              if not z: return "empty"
              if re.fullmatch(r"-?\d+(?:\.\d+)?(?:\s*(?:分钟|秒|米|站|m|km))?",z): return z
              if z in ("--","-","暂无数据","暂无车辆","无车","已到站","即将到站","未发车","待发车","已停运","无实时数据","暂无实时信息","未运营","运营结束"): return z
              return "other_text"
          try:
              print("PROBE UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
              d=post("/traffic/v2/querytrafficline",{"keywords":"闵行37路B线","type":0,"pageNo":1,"pageSize":20})
              lines={}
              for item in d.get("trafficStop") or []:
                  for x in (item.get("stopLineInfo") or [])+([item["lineInfo"]] if item.get("lineInfo") else []):
                      if norm(x.get("lineName")) in ("闵行37B","闵37B") and x.get("lineId"):
                          lines[str(x["lineId"])]=x
              if len(lines)!=1: raise ValueError("Unexpected route matches")
              line=next(iter(lines.values()))
              direction="0"
              d=post("/traffic/v1/querybusline",{"lineId":line["lineId"],"lineName":line["lineName"],"direction":direction})
              stops=(d.get("busLine") or {}).get("stop") or []
              print("PROBE direction",direction,"stop_count",len(stops))
              if len(stops)<2: raise ValueError("Insufficient stops")
              ids=[]
              for i,s in enumerate(stops[-2:],len(stops)-1):
                  print("PROBE SELECT",i,s["stopName"])
                  d=post("/traffic/v1/getbusstoparrivedetails",{"lineName":line["lineName"],"stopName":s["stopName"],"stopId":s["stopId"],"direction":direction})
                  a=d.get("stopArriveInfo") or {}
                  vals={k:state(a.get(k)) for k in ("currentBusArriveTime","nextBusArriveTime","currentBusDistance","nextBusDistance","currentBusStopCount","nextBusStopCount")}
                  ids.append({str(v) for v in (a.get("currentLicensePlate"),a.get("nextLicensePlate")) if v})
                  sc=d.get("dispatchCarSchedule") or {}
                  msg=str(sc.get("scheduleMsg",""))
                  print("PROBE STOP",i,s["stopName"],json.dumps(vals,ensure_ascii=False),"distinct_vehicles",len(ids[-1])==2,"planned_departures",len(sc.get("dispatchCars") or []),"schedule_indicators",{k:k in msg for k in ("停运","末班","发车","运营","暂无","无车","结束")})
              print("PROBE overlapping_vehicle_count",len(ids[0]&ids[1]))
          except urllib.error.HTTPError as e:
              print("PROBE HTTP",e.code,"stop")
          except Exception as e:
              print("PROBE error",type(e).__name__)
