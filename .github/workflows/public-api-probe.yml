name: One-time public API probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-api-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Two public bus stops
        shell: python
        run: |
          import json, re, urllib.request, urllib.error, datetime
          def post(path, body):
              req=urllib.request.Request("https://api.shmaas.net"+path,data=json.dumps(body).encode(),headers={"Content-Type":"application/json","X-Saic-CityCode":"310100","Accept":"application/json","User-Agent":"KindleHomeDashboard-public-api-test/1.0"},method="POST")
              with urllib.request.urlopen(req,timeout=15) as res:
                  d=json.loads(res.read(1048576))
                  print("PROBE",path,"HTTP",res.status,"business_code",d.get("errCode"))
                  if d.get("errCode") != 0: return {}
                  return d.get("data") or {}
          def norm(v):
              return re.sub(r"[\s（）()路]", "", str(v)).upper().replace("线","")
          def numeric(v):
              s=str(v).strip()
              return float(s) if re.fullmatch(r"\d+(?:\.\d+)?",s) else None
          targets=["金阳路中春路","金阳路瓶安路"]
          try:
              print("PROBE UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
              lines={}
              for keyword in ("闵行37路B线","闵37B","闵行37路"):
                  d=post("/traffic/v2/querytrafficline",{"keywords":keyword,"type":0,"pageNo":1,"pageSize":20})
                  for item in d.get("trafficStop") or []:
                      for x in (item.get("stopLineInfo") or [])+([item["lineInfo"]] if item.get("lineInfo") else []):
                          if norm(x.get("lineName")) in ("闵行37B","闵37B") and x.get("lineId") and x.get("upDown") is not None:
                              lines[(str(x["lineId"]),str(x["upDown"]))]=x
              print("PROBE route_candidates",len(lines))
              matches=[]
              trials={(lid,dr):line for (lid,_),line in lines.items() for dr in ("0","1")}
              for (_,direction),line in trials.items():
                  d=post("/traffic/v1/querybusline",{"lineId":line["lineId"],"lineName":line["lineName"],"direction":direction})
                  stops=(d.get("busLine") or {}).get("stop") or []
                  indices=[next((i for i,s in enumerate(stops) if (s.get("stopName")==name or (all(t in str(s.get("stopName")) for t in ("金阳路", "中春路" if j==0 else "瓶安路")))) and s.get("stopId")),None) for j,name in enumerate(targets)]
                  print("PROBE direction",direction,"stop_count",len(stops),"matched_indices",indices,"public_stop_variants",[s.get("stopName") for s in stops if any(t in str(s.get("stopName")) for t in ("中春路","瓶安路"))])
                  if all(i is not None for i in indices) and indices[0]<indices[1]:
                      chosen=[stops[i] for i in indices]
                      if not any([str(s["stopId"]) for s in m[2]]==[str(s["stopId"]) for s in chosen] for m in matches):
                          matches.append((line,direction,chosen))
              print("PROBE ordered_matches",len(matches))
              if len(matches)!=1: raise ValueError("Ambiguous route or direction")
              line,direction,stops=matches[0]
              ids=[]
              for s in stops:
                  d=post("/traffic/v1/getbusstoparrivedetails",{"lineName":line["lineName"],"stopName":s["stopName"],"stopId":s["stopId"],"direction":direction})
                  a=d.get("stopArriveInfo") or {}
                  vals={k:numeric(a.get(k)) for k in ("currentBusArriveTime","nextBusArriveTime","currentBusDistance","nextBusDistance","currentBusStopCount","nextBusStopCount")}
                  plates=[a.get("currentLicensePlate"),a.get("nextLicensePlate")]
                  ids.append({str(x) for x in plates if x})
                  print("PROBE STOP",s["stopName"],json.dumps(vals),"distinct_vehicles",len(ids[-1])==2,"schedule_present",bool(d.get("dispatchCarSchedule")))
              print("PROBE overlapping_vehicle_count",len(ids[0]&ids[1]))
          except urllib.error.HTTPError as e:
              print("PROBE HTTP",e.code,"stop")
          except Exception as e:
              print("PROBE error",type(e).__name__)
