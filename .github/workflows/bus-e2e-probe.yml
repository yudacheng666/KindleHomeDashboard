name: One-time bus browser and upstream verification
on:
  push:
    branches: [test/bus-end-to-end]
    paths: ['.github/workflows/bus-e2e-probe.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Browser with simulated provider
        shell: python
        run: |
          import os, shutil, subprocess, time, json
          from urllib.request import Request, urlopen
          from datetime import datetime, timezone, timedelta
          from tempfile import TemporaryDirectory
          from threading import Thread
          from secrets import token_urlsafe
          from dashboard.service import BusService
          from dashboard.runtime import Runtime, Window
          from dashboard.http_api import API, LocalServer

          def wd(path, body=None, method=None):
              data = None if body is None else json.dumps(body).encode()
              req = Request("http://127.0.0.1:9515"+path, data=data, method=method,
                            headers={"Content-Type":"application/json"})
              with urlopen(req, timeout=15) as r:
                  return json.load(r)["value"]
          def wait(fn):
              for _ in range(80):
                  if fn(): return
                  time.sleep(.15)
              raise AssertionError("Browser state not reached")
          chrome = shutil.which("google-chrome") or shutil.which("chromium")
          driver = shutil.which("chromedriver") or os.path.join(os.environ.get("CHROMEWEBDRIVER",""),"chromedriver")
          assert chrome and os.path.isfile(driver), "Browser or driver unavailable"
          with TemporaryDirectory() as directory:
              clock = [datetime(2026,1,5,0,tzinfo=timezone.utc)]
              calls = []
              def provider(path, body, city):
                  calls.append(path)
                  if path.endswith("querytrafficline"):
                      data={"trafficStop":[{"lineInfo":{"lineId":"sample","lineName":"示例线路","startStopName":"甲站","endStopName":"丙站","upDown":0}}]}
                  elif path.endswith("querybusline"):
                      data={"busLine":{"lineId":"sample","lineName":"示例线路","upDown":0,"stop":[{"stopId":str(i),"stopName":name,"upDown":0} for i,name in enumerate(["甲站","乙站","丙站"])]}}
                  else:
                      data={"stopArriveInfo":{"currentBusArriveTime":"4","currentBusDistance":"300","currentBusStopCount":"1","nextBusArriveTime":"9","nextBusDistance":"1500","nextBusStopCount":"3"}}
                  return {"errCode":0,"data":data}
              bus=BusService(directory,enabled=True,request=provider,clock=lambda:clock[0])
              rt=Runtime(bus,windows=(Window(tuple(range(7)),0,1440),),clock=lambda:clock[0])
              read,admin=token_urlsafe(32),token_urlsafe(32)
              with LocalServer(API(rt,read,admin),0) as server:
                  thread=Thread(target=server.serve_forever,daemon=True)
                  thread.start()
                  proc=subprocess.Popen([driver,"--port=9515","--allowed-ips=127.0.0.1"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  sid=None
                  try:
                      def ready():
                          try: return wd("/status").get("ready")
                          except Exception: return False
                      wait(ready)
                      session=wd("/session",{"capabilities":{"alwaysMatch":{"browserName":"chrome","goog:chromeOptions":{"binary":chrome,"args":["--headless=new","--no-sandbox","--disable-dev-shm-usage","--window-size=600,800"]}}}})
                      sid=session["sessionId"]
                      def js(script,args=()):
                          return wd("/session/"+sid+"/execute/sync",{"script":script,"args":list(args)})
                      wd("/session/"+sid+"/url",{"url":"http://127.0.0.1:"+str(server.server_port)+"/"})
                      wait(lambda:js("return !!document.getElementById('connect').onclick"))
                      js("document.getElementById('token').value=arguments[0];document.getElementById('mode').value='admin';document.getElementById('connect').click()",[admin])
                      wait(lambda:js("return document.getElementById('dashboard').className !== 'hidden'"))
                      js("document.getElementById('settings').click();document.getElementById('keyword').value='示例';document.getElementById('search').click()")
                      wait(lambda:js("return document.getElementById('route').options.length===1"))
                      clock[0]+=timedelta(seconds=2)
                      js("document.getElementById('detail').click()")
                      wait(lambda:js("return document.getElementById('board').options.length===2"))
                      js("document.getElementById('board').value='1';document.getElementById('board').dispatchEvent(new Event('change'))")
                      assert js("return document.getElementById('destination').options.length===1 && document.getElementById('destination').value==='2'")
                      js("document.getElementById('save').click()")
                      wait(lambda:js("return document.getElementById('config').className==='hidden'"))
                      assert bus.trip.boarding.name=="乙站" and bus.trip.destination.name=="丙站"
                      clock[0]+=timedelta(seconds=2)
                      rt.step()
                      js("document.getElementById('refresh').click()")
                      wait(lambda:js("return document.getElementById('vehicles').children.length===2"))
                      assert js("return document.getElementById('vehicles').textContent.indexOf('4 分钟')>=0 && document.getElementById('vehicles').textContent.indexOf('9 分钟')>=0")
                      before=len(calls)
                      js("document.getElementById('refresh').click()")
                      wait(lambda:js("return !document.getElementById('refresh').disabled"))
                      assert len(calls)==before
                      clock[0]+=timedelta(seconds=91)
                      js("document.getElementById('refresh').click()")
                      wait(lambda:js("return document.getElementById('vehicles').children.length===0"))
                      assert js("return document.getElementById('status').textContent.indexOf('过期')>=0")
                      js("document.getElementById('logout').click()")
                      assert js("return document.getElementById('dashboard').className==='hidden' && document.getElementById('trip').textContent===' ' .trim()")
                      print("E2E BROWSER PASS real Chromium; synthetic upstream; selection, two ETA, cache, expiry, logout")
                  finally:
                      if sid:
                          try: wd("/session/"+sid,method="DELETE")
                          except Exception: pass
                      proc.terminate()
                      try: proc.wait(timeout=5)
                      except subprocess.TimeoutExpired: proc.kill()
                      server.shutdown()
                      thread.join(timeout=3)
      - name: New adapter public example (no household configuration)
        if: always()
        shell: python
        run: |
          from tempfile import TemporaryDirectory
          import time
          from dashboard.service import BusService
          from dashboard.bus import BusError, AccessBlocked
          stage="search"
          try:
              with TemporaryDirectory() as directory:
                  svc=BusService(directory,enabled=True,daily_limit=5)
                  lines=svc.search_lines("71路")
                  print("E2E LIVE search results",len(lines))
                  exact=[line for line in lines if line.name=="71路"]
                  if not exact: raise BusError("Public sample absent")
                  stage="detail"
                  time.sleep(2.2)
                  route=svc.get_route(exact[0])
                  print("E2E LIVE detail stops",len(route.stops),"direction",route.line.direction)
                  stage="save"
                  # Public sample only; no raw station names, IDs or plates in logs.
                  svc.save_trip(route, min(4,len(route.stops)-2),len(route.stops)-1)
                  stage="eta"
                  time.sleep(2.2)
                  snap=svc.tick().snapshot
                  print("E2E LIVE status",snap.status,"vehicle_count",len(snap.vehicles))
                  print("E2E LIVE eta_minutes",[v.eta_min for v in snap.vehicles])
                  if snap.status not in ("live","no_live_data"):
                      raise BusError("ETA not accepted")
                  print("E2E LIVE PASS search/detail/save/ETA response parsed; independent accuracy not checked")
          except (BusError, ValueError, OSError) as e:
              print("E2E LIVE INCOMPLETE stage",stage,"class",type(e).__name__)
              raise SystemExit(1)
