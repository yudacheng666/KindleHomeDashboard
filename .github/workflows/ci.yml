name: Public repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public tree
        run: python3 scripts/check_public.py
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check browser logic offline
        run: |
          node --check dashboard/web/bus.js
          node tests/test_bus_ui.js
          node --check dashboard/web/home.js
          node tests/test_home_ui.js
          node --check dashboard/web/admin.js
          node --check dashboard/web/display.js
          node tests/test_display_ui.js
      - name: Real household browser integration
        run: PYTHONPATH=. KHD_VISUAL_OUTPUT="${{ runner.temp }}/khd-visual" python3 tests/browser_household.py
      - name: Store fictional browser screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overview-browser-visual
          path: ${{ runner.temp }}/khd-visual/overview-768x640.png
          if-no-files-found: warn
          retention-days: 7
      - name: Scan Git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and exercise private local container
        run: bash tests/docker_smoke.sh
