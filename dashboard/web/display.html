<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭看板 · 展示</title>
<style>
body{max-width:600px;margin:0 auto;padding:8px;background:#fff;color:#111;font:20px/1.45 sans-serif}
h1{font-size:30px;margin:8px 0}h2{font-size:25px;margin:8px 0}p{margin:10px 0;white-space:pre-wrap;word-wrap:break-word}
button,input,select{box-sizing:border-box;font:inherit;background:white;color:#111;border:1px solid #333;border-radius:3px;padding:9px;min-height:44px;max-width:100%}
button{margin:4px 4px 4px 0}input[type=password]{display:block;width:100%;margin:8px 0}
.hidden{display:none}.display-nav{display:table;table-layout:fixed;width:100%;border-bottom:1px solid #333}.display-nav span{display:table-cell;width:16.66%;vertical-align:middle}.display-nav button{width:100%;margin:0;border:0;border-radius:0;padding:6px 1px;font-size:16px;white-space:nowrap}.setting-list a{display:block;border-bottom:1px solid #aaa;padding:12px 0}#index:empty,#date:empty,#status:empty{display:none}#settingsPanel h2{font-size:20px}.frame{border-top:2px solid #111;border-bottom:2px solid #111;min-height:220px;padding:16px 0}
.poster{text-align:center;font-size:38px;line-height:1.5;font-weight:bold}.poster.medium{font-size:30px}.poster.compact{font-size:24px}.note{font-size:16px;color:#333}.eta{font-size:44px;line-height:1.2;font-weight:bold}
label{display:block;margin:8px 0}a{color:#111}button.selected{background:#111;color:#fff}.status{font-size:15px;color:#444}

/* Identical two-column geometry for both slots; only hierarchy changes. */
.bus-slot{padding:12px 0;border-bottom:1px solid #777}
.bus-slot-label{font-size:16px;color:#444;margin-bottom:5px}
.bus-pair{display:table;table-layout:fixed;width:100%}
.bus-left,.bus-right{display:table-cell;width:50%;vertical-align:middle;word-wrap:break-word;white-space:normal}
.bus-left{padding-right:5px;text-align:left}
.bus-right{padding-left:5px;text-align:right}
.bus-first .eta{font-size:48px;font-weight:bold;line-height:1.15}
.bus-first .eta.bus-state{font-size:29px}
.bus-next .eta{font-size:25px;font-weight:bold;line-height:1.2}
.bus-next .eta.bus-state{font-size:21px}
.bus-time{font-size:22px;font-weight:bold;line-height:1.35;white-space:pre-line}
.bus-next .bus-time{font-size:17px}
.bus-details{font-size:17px;color:#444;margin-top:8px}
.bus-next .bus-details,.bus-next .bus-slot-label{font-size:14px}
#weatherResults button{display:block;width:100%;text-align:left;white-space:normal;margin:4px 0}#weatherResults small{display:block;color:#444;font-size:14px}
@media(max-width:360px){.bus-first .eta{font-size:36px}.bus-first .eta.bus-state{font-size:24px}.bus-next .eta{font-size:21px}.bus-next .eta.bus-state{font-size:18px}.bus-time{font-size:18px}.bus-next .bus-time{font-size:15px}.bus-details{font-size:15px}}
.task-row{display:table;width:100%;table-layout:fixed;border-bottom:1px solid #bbb;padding:5px 0}.task-text{display:table-cell;vertical-align:middle;word-wrap:break-word;padding-right:8px}.task-action{display:table-cell;width:64px;vertical-align:middle;text-align:right}.task-complete{font-size:14px;color:#555;border:1px solid #aaa;padding:5px 9px;background:#fff;min-height:44px;margin:0}.task-complete:disabled{color:#999}
.menu-day{padding:9px 0;border-bottom:1px solid #aaa}.menu-date{font-size:20px;margin:0 0 5px;font-weight:bold}.menu-today{font-size:13px;color:#555;font-weight:normal;margin-left:9px}.menu-meal{display:table;width:100%;table-layout:fixed;padding:3px 0}.menu-meal-label,.menu-dishes{display:table-cell;vertical-align:top}.menu-meal-label{width:2.8em;font-size:17px;color:#555}.menu-dishes{font-size:19px;word-wrap:break-word;white-space:pre-wrap}

.weather-main{font-size:46px;font-weight:bold;line-height:1.2;margin:6px 0}
.weather-block{border-top:1px solid #aaa;padding:6px 0}
.weather-strip{display:table;table-layout:fixed;width:100%;font-size:14px;text-align:center}
.weather-cell{display:table-cell;padding:2px 0;vertical-align:top;word-wrap:break-word}
.weather-cell p{margin:2px 0}.weather-source{font-size:12px;color:#555;word-wrap:break-word}
.weather-location{border-top:2px solid #333;padding:6px 0;margin:8px 0}.weather-location h2{margin:4px 0;font-size:20px}.rain-bars{display:table;table-layout:fixed;width:100%;height:32px}.rain-bars span{display:table-cell;vertical-align:bottom;padding:0 1px}.rain-bars b{display:block;background:#333;min-height:1px}.weather-compact{font-size:30px;font-weight:bold;margin:4px 0}
.weather-alert{border:2px solid #222;padding:5px;margin:5px 0}
#weatherForm input[type=text],#weatherForm input[type=number]{width:100%;display:block}
@media(max-width:360px){.display-nav button{font-size:14px}.weather-strip{font-size:12px}}
</style></head>
<body><div id="login"><h1>家庭看板</h1><p>公交与家庭统一展示原型 · 本地网络</p><label for="token">只读访问令牌</label><input id="token" type="password" maxlength="128" autocomplete="off"><button id="connect" type="button">连接</button></div>
<p id="status" class="status" role="status"></p>
<div id="display" class="hidden">
<div id="displayNav"><div class="display-nav"><span><button id="busMode" type="button">公交</button></span><span><button id="tasksMode" type="button">待办</button></span><span><button id="postersMode" type="button">海报</button></span><span><button id="menusMode" type="button">菜单</button></span><span><button id="weatherMode" type="button">天气</button></span><span><button id="settings" type="button" aria-label="设置" title="设置">设置</button></span></div></div>
<div id="displayContent"><p id="date" class="status"></p><div id="frame" class="frame"><h1 id="heading"></h1><div id="body"></div></div><p id="index" class="status"></p></div>
<div id="settingsPanel" class="hidden"><button id="returnDisplay" type="button">返回看板</button><h1>设置</h1>
<h2>显示设置</h2><a id="displayManage" href="/home#display">保存默认海报轮播设置</a><p id="modeStatus" class="status"></p><button id="autoMode" type="button">恢复自动分时</button>
<div id="familyControls" class="hidden"><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button><button id="pause" type="button">开始轮播</button></div>
<div id="options" class="hidden"><label for="seconds">本次海报停留时间</label><select id="seconds"><option value="120">2分钟</option><option value="180">3分钟</option><option value="300">5分钟</option></select><p class="status">本次调整不修改 NAS 保存的默认设置。</p><button id="apply" type="button">应用本次显示设置</button><button id="cancel" type="button">取消</button></div>
<div class="setting-list"><a id="manageLink" href="/bus">公交设置 · 线路、站点及采集时段</a><a id="tasksManage" href="/home#tasks">待办清单管理</a><a id="postersManage" href="/home#posters">海报管理 · 保存默认轮播设置</a><a id="menusManage" href="/home#menus">本周菜单管理</a><a id="catalogManage" href="/home#catalog">家庭菜单维护</a></div>

<h2>天气设置</h2><p class="status">单地点，和风天气优先，Open-Meteo 备用。凭据在 NAS 私有容器配置中填写，网页不会读取或显示密钥。</p>
<button id="weatherLoad" type="button">读取天气设置</button><p id="weatherSettingStatus" class="status" role="status"></p>
<div id="weatherForm" class="hidden"><label><input id="weatherEnabled" type="checkbox"> 开启天气采集</label>
<label><input id="weatherConsent" type="checkbox"> 同意 NAS 向和风天气发送搜索的城市名称，并向和风天气及 Open-Meteo 发送所选地点近似坐标查询天气；接受服务条款，知悉和风超额可能收费。</label>
<p class="status">最多3个地点；第1个为主地点，其他地点独立显示实时天气、降水和预警。</p>
<div id="weatherLocations"></div><button id="weatherAdd" type="button">添加地点</button><button id="weatherMakePrimary" type="button">设为主地点</button><button id="weatherRemove" type="button">移除当前地点</button>
<p id="weatherSelected" class="status"></p>
<label for="weatherKeyword">搜索城市或区县</label><input id="weatherKeyword" type="text" maxlength="40" placeholder="输入城市、区县名称" autocomplete="off">
<button id="weatherSearch" type="button">搜索地点</button><p id="weatherSearchStatus" class="status" role="status"></p>
<div id="weatherResults"></div>
<label for="weatherName">显示地点名称（可自定义）</label><input id="weatherName" type="text" maxlength="40">
<button id="weatherManual" type="button">手动输入 / 查看坐标</button>
<div id="weatherCoordinates" class="hidden">
<label for="weatherLat">纬度（WGS84，最多两位小数）</label><input id="weatherLat" type="text" inputmode="decimal" maxlength="12">
<label for="weatherLon">经度（WGS84，最多两位小数）</label><input id="weatherLon" type="text" inputmode="decimal" maxlength="12">
</div>
<p id="weatherBudget" class="status"></p><button id="weatherSave" type="button">保存天气设置</button></div>
<h2>系统信息</h2><p id="version" class="status"></p><p class="status">数据由本地 NAS 提供；各模块显示采集及错误状态。</p><button id="logout" type="button">退出连接</button></div>
</div><script src="/access-mode.js"></script><script src="/display.js"></script></body></html>
