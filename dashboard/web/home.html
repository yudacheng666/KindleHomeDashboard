<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看板 · 内容管理</title>
<style>
body{max-width:680px;margin:0 auto;padding:16px;color:#111;background:#fff;font:17px/1.5 sans-serif}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}p{margin:8px 0;white-space:pre-wrap;overflow-wrap:break-word}
button,input,select,textarea{box-sizing:border-box;font:inherit;padding:9px;border:1px solid #444;border-radius:4px;background:white;color:#111;max-width:100%}
button{min-height:44px;margin:4px 6px 4px 0}button:disabled{color:#777}
input,select,textarea{display:block;width:100%;margin:4px 0 12px}label{display:block}
textarea{min-height:90px}.panel{border-top:2px solid #333;padding:12px 0}.item{border-bottom:1px solid #aaa;padding:8px 0}
.primary{background:#222;color:#fff}.hidden{display:none}.poster{font-size:28px;font-weight:bold;white-space:pre-wrap;overflow-wrap:break-word}
small{color:#555}a{color:#222}.tablink{display:inline-block;border:1px solid #444;border-radius:4px;padding:9px;text-decoration:none;margin:4px 6px 4px 0}
.menu-day{border-bottom:1px solid #aaa;padding:8px 0}.menu-date{margin:4px 0}.menu-today{font-size:13px;font-weight:normal;color:#555;margin-left:9px}.menu-day .item{border-bottom:0;padding:5px 0}
.catalog-layout{display:table;table-layout:fixed;width:100%}.catalog-nav{display:table-cell;width:100px;vertical-align:top;padding-right:6px}.catalog-nav button{width:100%;margin-right:0;word-wrap:break-word}.catalog-body{display:table-cell;vertical-align:top;word-wrap:break-word}.dish-pick{margin:3px;padding:8px}.dish-selected{background:#222;color:#fff}.week-days{display:table;table-layout:fixed;width:100%}.week-days span{display:table-cell;width:14.28%;vertical-align:top}.week-days button{width:100%;padding:4px 0;margin:0;font-size:14px;white-space:pre-line}.meal-pick{margin:5px 0}.menu-editor-note{font-size:14px;color:#555}.catalog-tools{margin-bottom:8px}
.shared-dish{display:table;width:100%;table-layout:fixed;border-bottom:1px solid #ccc}.shared-dish span{display:table-cell;vertical-align:middle;word-wrap:break-word}.shared-dish button{font-size:14px;color:#555;float:right}.shared-dishes h3{margin:8px 0}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:4px}.week-nav span{font-size:14px;flex:1;text-align:center}.dish-check{display:block}.dish-check input{display:inline-block;width:auto;margin:4px 8px 4px 0;vertical-align:middle}
.menu-save-feedback{font-size:15px;font-weight:bold;min-height:1em;margin:8px 0}.menu-save-feedback:empty{display:none}

body{max-width:960px;padding:12px 16px;background:#f5f6f8;color:#1f2937;font:16px/1.5 sans-serif}
h1{font-size:24px;margin:8px 0}h2{font-size:20px}
.panel{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:12px}.item,.menu-day{border-color:#d1d5db}
#tabs{margin:8px 0 12px}#tabs button,#tabs a{box-sizing:border-box;min-height:48px;margin:3px 4px 3px 0;padding:10px 12px;text-align:left;background:#fff;color:#1f2937;border:1px solid #777;border-radius:8px}
#tabs button.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
#editor:not(.hidden){background:#fff;padding:12px;border:1px solid #d1d5db;border-radius:8px}
.dish-pick{min-height:48px}.dish-selected{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.week-nav button{margin:3px 0}.week-days button{font-size:13px;padding:4px 0}.catalog-nav{width:88px}
.menu-save-feedback{word-wrap:break-word}

/* Shared visual rules for the existing settings surfaces; no UI library. */
button,input,select,textarea{font-size:16px;min-height:48px;border-radius:8px;border-color:#777}
button:focus,input:focus,select:focus,textarea:focus,a:focus{outline:2px solid #1d4ed8;outline-offset:2px}
button:active{background:#e5e7eb;color:#111}button:disabled{opacity:.65}
input[type=checkbox]{min-height:24px;width:24px;vertical-align:middle;margin:0 8px 0 0}
.primary,button.selected{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
label{line-height:1.5}input,select,textarea{background:#fff}
@media(min-width:1024px){button,input,select{min-height:40px}input[type=checkbox]{min-height:24px}}

@media(min-width:1024px){body{padding:24px 32px}#tabs{float:left;width:210px;margin:0}#tabs button,#tabs a{display:block;width:100%;margin:0 0 6px;min-height:44px}#content,#editor{margin-left:226px}#home:after{content:"";display:block;clear:both}.catalog-nav{width:120px}}
</style></head>
<body><h1>设置 · 内容管理</h1><p><a id="returnLink" href="/display">返回看板</a></p>
<div id="login" class="panel"><label for="token">访问令牌</label><input id="token" type="password" maxlength="128" autocomplete="off">
<label for="mode">访问方式</label><select id="mode"><option value="read">仅查看</option><option value="admin">内容管理</option></select><button id="connect" type="button" class="primary">连接</button></div>
<p id="message" role="status" aria-live="polite"></p>
<div id="home" class="hidden"><p id="date"></p><button id="refresh" type="button">刷新</button><button id="logout" type="button">退出</button>
<div id="tabs"><a id="busTab" class="tablink" href="/bus">公交设置</a><button id="tasks" type="button">待办清单</button><button id="posters" type="button">海报</button><button id="menus" type="button">本周菜单</button><button id="catalog" type="button">家庭菜单维护</button><button id="displaySettings" type="button">显示设置</button></div>
<div id="editor" class="hidden"></div><div id="content" class="panel"></div>
</div><script src="/access-mode.js"></script><script src="/home.js"></script></body></html>
