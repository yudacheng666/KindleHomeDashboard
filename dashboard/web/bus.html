<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭看板 · 公交</title>
<style>
body{margin:0 auto;padding:18px;max-width:560px;background:#fff;color:#111;font:18px/1.5 sans-serif}
h1{font-size:26px;margin:0} h2{font-size:22px;margin:12px 0}
p{margin:8px 0} label{display:block;margin:12px 0 4px}
input,select,button{box-sizing:border-box;font:inherit;color:#111;background:#fff;border:1px solid #444;border-radius:4px;padding:10px;max-width:100%}
input,select{width:100%} button{min-height:44px;margin:4px 0;cursor:pointer} button:disabled{color:#777} input[type=checkbox]{width:auto;margin-right:6px} .schedule-row{border:1px solid #aaa;padding:10px;margin:10px 0} .schedule-row label{display:inline-block;margin:4px 10px 4px 0} .schedule-time{display:inline-block;white-space:nowrap;margin:4px 10px 4px 0}.schedule-time select{width:auto;min-width:56px;padding:8px;min-height:44px}
.primary{background:#222;color:#fff} .small{font-size:14px;color:#555}
.panel{border-top:2px solid #222;margin-top:18px;padding-top:14px}
.vehicle{padding:12px 0;border-bottom:1px solid #777}.eta{font-size:52px;font-weight:bold;line-height:1.1}
.muted{color:#555}.hidden{display:none}.notice{border:2px solid #444;padding:10px}

/* Identical two-column geometry for both slots; only hierarchy changes. */
.bus-slot{padding:12px 0;border-bottom:1px solid #777}
.bus-slot-label{font-size:16px;color:#444;margin-bottom:5px}
.bus-pair{display:table;table-layout:fixed;width:100%}
.bus-left,.bus-right{display:table-cell;width:50%;vertical-align:middle;word-wrap:break-word;white-space:normal}
.bus-left{padding-right:5px;text-align:left}
.bus-right{padding-left:5px;text-align:right}
.bus-first .eta{font-size:48px;font-weight:bold;line-height:1.15}
.bus-first .eta.bus-state{font-size:29px}
.bus-next .eta{font-size:25px;font-weight:bold;line-height:1.2}
.bus-next .eta.bus-state{font-size:21px}
.bus-time{font-size:22px;font-weight:bold;line-height:1.35;white-space:pre-line}
.bus-next .bus-time{font-size:17px}
.bus-details{font-size:17px;color:#444;margin-top:8px}
.bus-next .bus-details,.bus-next .bus-slot-label{font-size:14px}
@media(max-width:360px){.bus-first .eta{font-size:36px}.bus-first .eta.bus-state{font-size:24px}.bus-next .eta{font-size:21px}.bus-next .eta.bus-state{font-size:18px}.bus-time{font-size:18px}.bus-next .bus-time{font-size:15px}.bus-details{font-size:15px}}
</style>
</head>
<body>
<h1>设置 · 公交</h1><p><a id="returnLink" href="/display#bus">返回看板</a></p>
<div id="login" class="panel">
<label for="token">访问令牌（由本机管理员提供）</label>
<input type="password" id="token" autocomplete="off" maxlength="128">
<label for="mode">访问方式</label>
<select id="mode"><option value="read">仅查看</option><option value="admin">管理公交</option></select>
<button id="connect" class="primary" type="button">连接</button>
</div>
<p id="message" role="status" aria-live="polite"></p>
<div id="dashboard" class="hidden">
<p><button id="refresh" type="button">刷新显示</button> <button id="settings" type="button">公交设置</button> <button id="scheduleSettings" type="button">采集时间设置</button> <button id="logout" type="button">退出</button></p>
<div id="view" class="panel" aria-live="polite">
<p id="clock" class="small"></p><h2 id="line">尚未配置公交</h2><p id="trip"></p>
<p id="status" class="notice">正在读取</p>
<div id="vehicles"></div>
<p id="updated" class="small"></p>
</div>
<div id="scheduleConfig" class="panel hidden">
<h2>公交采集设置</h2>
<p class="small" id="scheduleZone"></p>
<label for="scheduleEnabled">公交联网采集</label>
<select id="scheduleEnabled"><option value="0">关闭</option><option value="1">开启</option></select>
<p class="small">选择星期、开始和结束的小时及分钟。采用24小时制，结束可选24:00；结束早于开始表示跨午夜。仅在指定时段自动采集；手动线路搜索也会消耗本地额度。</p>
<div id="scheduleRows"></div>
<button id="scheduleAdd" type="button">添加时段</button>
<p id="scheduleStored" class="small"></p>
<button id="scheduleSave" class="primary" type="button">保存采集设置</button>
<button id="scheduleCancel" type="button">取消 / 返回</button>
<p id="scheduleMessage" role="status" aria-live="polite"></p>
</div>
<div id="config" class="panel hidden">
<h2>选择公交</h2>
<label for="keyword">线路名称</label>
<input id="keyword" maxlength="80" autocomplete="off" placeholder="输入线路名称或简称">
<button id="search" type="button">搜索</button>
<p class="small">先搜索线路，再选择方向和站点。</p>
<div id="results" class="hidden">
<label for="route">选择线路</label><select id="route"></select>
<div id="directionStep" class="hidden"><label for="direction">行驶方向</label><select id="direction"></select>
<button id="detail" type="button">获取站点</button></div>
</div>
<div id="stations" class="hidden">
<p id="endpoints"></p>
<label for="board">上车站</label><select id="board"></select>
<label for="destination">下车站</label><select id="destination"></select>
<p id="selection-summary"></p>
<button id="save" type="button" class="primary">保存并返回公交</button>
</div>
<button id="cancel" type="button">取消设置</button>
</div>
</div>
<script src="/access-mode.js"></script><script src="/bus.js"></script>
</body></html>
